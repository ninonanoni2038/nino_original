<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>○×ゲーム</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <main class="container">
      <header class="auth-bar">
        <div id="loginArea" class="login-area">
          <div id="gSignInBtn"></div>
        </div>
        <div id="userArea" class="user-area" hidden>
          <img id="userAvatar" class="user-avatar" alt="" referrerpolicy="no-referrer" />
          <span id="userName" class="user-name"></span>
          <button id="signOutBtn" class="signout-btn">ログアウト</button>
        </div>
      </header>
      <h1>○×ゲーム</h1>
      <p class="status" id="status">あなたの番です（○）</p>
      <div class="board" id="board">
        <button class="cell" data-index="0" aria-label="セル1"></button>
        <button class="cell" data-index="1" aria-label="セル2"></button>
        <button class="cell" data-index="2" aria-label="セル3"></button>
        <button class="cell" data-index="3" aria-label="セル4"></button>
        <button class="cell" data-index="4" aria-label="セル5"></button>
        <button class="cell" data-index="5" aria-label="セル6"></button>
        <button class="cell" data-index="6" aria-label="セル7"></button>
        <button class="cell" data-index="7" aria-label="セル8"></button>
        <button class="cell" data-index="8" aria-label="セル9"></button>
      </div>
      <div class="controls">
        <button id="reset" class="reset-btn">もう一度</button>
      </div>
      <div class="score">
        <div><span class="label" id="scoreYouLabel">あなた（○）</span><span id="scoreYou">0</span></div>
        <div><span class="label">CPU（×）</span><span id="scoreCpu">0</span></div>
        <div><span class="label">引き分け</span><span id="scoreDraw">0</span></div>
      </div>
    </main>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="script.js"></script>
  </body>
</html>
